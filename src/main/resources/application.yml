spring:
  application:
    name: Zigu-WAS
  profiles:
    default: local

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${VERIFY_EMAIL}
    password: ${VERIFY_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret-key: ${SECRET_KEY}