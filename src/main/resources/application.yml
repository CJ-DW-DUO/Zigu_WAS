spring:
  application:
    name: Zigu-WAS
  profiles:
    default: local

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${VERIFY_EMAIL}
    password: ${VERIFY_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret-key: ${SECRET_KEY}

app:
  swagger:
    server-url: ${SWAGGER_SERVER_URL:http://localhost:8080}

chat:
  room:
    # 폐쇄된 채팅방의 보관기간(일). 모든 참여자가 나간 시각으로부터 이 기간이 지나면
    # 매일 새벽 4시 배치가 채팅방과 메시지를 S3 이미지까지 영구 삭제한다.
    # (ChatRoomRetentionScheduler)
    retention-days: 90


