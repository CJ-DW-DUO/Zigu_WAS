spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5 # 1GB 서버용(기본 10) — PG 백엔드 프로세스 수·메모리 절약 (런북 server-setup-t3micro §3)

  jpa:
    hibernate.ddl-auto: update
    show-sql: false

cloud:
  aws:
    s3:
      # endpoint 설정 없음 -> 자동으로 S3로 접속
      bucket: ${BUCKET_NAME} # 실제 S3 버킷명으로 변경 필요
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION:ap-southeast-2} # 서버가 시드니(D-029). 서울로 옮기면 AWS_REGION 환경변수만 바꾼다
    stack:
      auto: false

server:
  tomcat:
    threads:
      max: 50 # 기본 200 — 스레드 스택 메모리 절약 (런북 §3)
