spring:
  datasource:
    url: ${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/zigu}
    username: ${LOCAL_DB_USERNAME:zigu}
    password: ${LOCAL_DB_PASSWORD:zigu_local}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate.ddl-auto: update
    show-sql: true

cloud:
  aws:
    s3:
      endpoint: http://localhost:4566 # 로컬스택
      bucket: test-bucket
    credentials:
      access-key: ${LOCAL_ACCKEY:test}
      secret-key: ${LOCAL_SECKEY:test}
    region:
      static: ap-northeast-2
    stack:
      auto: false