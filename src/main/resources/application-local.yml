spring:
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate.ddl-auto: update
    show-sql: true

cloud:
  aws:
    s3:
      endpoint: http://localhost:4566 # 로컬스택
      bucket: test-bucket
    credentials:
      access-key: ${LOCAL_ACCKEY}
      secret-key: ${LOCAL_SECKEY}
    region:
      static: ap-northeast-2
    stack:
      auto: false