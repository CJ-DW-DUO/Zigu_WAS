services:
  db:
    image: pgvector/pgvector:pg17        # D-012·D-020 (pgvector 확장은 만들지 않음)
    container_name: zigu-db
    restart: always
    volumes:
      - db-volume:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # 1GB 서버용 메모리 상한 (근거 3-3)
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=256MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c max_connections=20
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options: { max-size: "10m", max-file: "3" }
    # ports 없음 — 5432 는 compose 내부망에서만

  app:
    image: chlwjd0803/zigu-was:latest
    container_name: zigu-was
    restart: always
    ports:
      - "127.0.0.1:8080:8080"            # 서버 안(Caddy/nginx)에서만 접근, 외부 8080 비공개
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 640m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # JVM 메모리 상한 (근거 3-3)
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx320m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      SERVER_TOMCAT_THREADS_MAX: 50                # 기본 200 → 스레드 스택 메모리 절약
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5 # 기본 10 → PG 백엔드 프로세스 수 절약
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      VERIFY_EMAIL: ${VERIFY_EMAIL}
      VERIFY_PASSWORD: ${VERIFY_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      BUCKET_NAME: ${BUCKET_NAME}
      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL}    # 옛 compose 에 빠져 있던 키(U-45)
    logging:
      options: { max-size: "10m", max-file: "3" }

volumes:
  db-volume:
